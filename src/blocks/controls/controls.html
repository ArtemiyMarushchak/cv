<div class="cv-controls" id="cv-controls">
<div class="cv-theme" id="cv-theme">
  <button class="cv-theme__button" type="button" aria-label="Переключить тему" title="Переключить тему">
    <span class="cv-theme__icon cv-theme__icon--moon" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path class="cv-theme-fill" d="M14.9 2.8a8.9 8.9 0 1 0 6.3 13.7 7.4 7.4 0 0 1-6.3-13.7Z"></path><path class="cv-theme-star" d="m18.4 4.1.45 1.25 1.25.45-1.25.45-.45 1.25-.45-1.25-1.25-.45 1.25-.45.45-1.25Z"></path></svg>
    </span>
    <span class="cv-theme__icon cv-theme__icon--sun" aria-hidden="true">
      <svg viewBox="0 0 24 24"><circle class="cv-theme-fill" cx="12" cy="12" r="4.25"></circle><path d="M12 2.2v2.1M12 19.7v2.1M4.9 4.9l1.5 1.5M17.6 17.6l1.5 1.5M2.2 12h2.1M19.7 12h2.1M4.9 19.1l1.5-1.5M17.6 6.4l1.5-1.5"></path></svg>
    </span>
  </button>
</div>

<div class="cv-language" id="cv-language" aria-label="Language switcher">
  <button class="cv-language__toggle" type="button" aria-expanded="false" aria-controls="cv-language-menu">
    <svg class="cv-language__icon" viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.7"/>
      <path d="M3.5 12h17M12 3c2.2 2.4 3.4 5.4 3.4 9S14.2 18.6 12 21M12 3C9.8 5.4 8.6 8.4 8.6 12S9.8 18.6 12 21" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
    <span class="cv-language__current">RU</span>
  </button>

  <div class="cv-language__menu" id="cv-language-menu">
    <button class="cv-language__button is-active" type="button" data-cv-lang="ru" aria-pressed="true">RU</button>
    <button class="cv-language__button" type="button" data-cv-lang="sk" aria-pressed="false">SK</button>
    <button class="cv-language__button" type="button" data-cv-lang="en" aria-pressed="false">EN</button>
  </div>
</div>
</div>
