<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Детский профориентационный квиз — Артемий Марущак</title>
<style>
html,body{margin:0;min-height:100%;background:#1a2132}.page{padding:24px}.back{display:inline-flex;margin:0 auto 14px;max-width:1200px;color:#fff;text-decoration:none;font:700 14px system-ui,-apple-system,"Segoe UI",sans-serif}.kquiz{--accent:#1e4bca;--accent-ink:#fff;--accent-weak:rgba(30,75,202,.16);--card:#1a2132;--panel:#1c2740;--ink:#f2f5ff;--muted:#c4cce3;--line:#31427a;--danger:#ff6b6b;--gap:16px;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Inter,Arial,sans-serif;color:var(--ink)}.kquiz *{box-sizing:border-box}.kquiz__form{max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:20px}.kquiz__head{background:linear-gradient(180deg,rgba(30,75,202,.1),transparent);border:1px solid var(--accent-weak);padding:20px;border-radius:20px}.kquiz__h1{margin:0 0 6px;font-size:28px;line-height:1.2}.kquiz__lead{margin:0;color:var(--muted)}.kquiz__name{display:flex;gap:12px;margin-top:12px;flex-wrap:wrap}.kquiz__name input{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:260px;outline:none}.kquiz__q{border:1px solid var(--line);border-radius:20px;background:var(--card);margin:0 0 22px;padding:22px}.kquiz__qtitle{margin:0 0 14px;font-weight:800;font-size:22px;line-height:1.25;color:#e2e8ff}.kquiz__grid{display:grid;gap:var(--gap);grid-template-columns:repeat(12,minmax(0,1fr))}.kquiz__cell{grid-column:span 3}.kquiz__opt{position:relative;display:flex;flex-direction:column;gap:10px;background:#15203a;border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;transition:.18s;min-height:100%}.kquiz__opt:hover{transform:translateY(-2px);border-color:var(--accent);box-shadow:0 10px 26px rgba(30,75,202,.25)}.kquiz__opt input{position:absolute;inset:0;opacity:0;cursor:pointer}.kquiz__img{aspect-ratio:4/3;background:#0b0e15;display:block;width:100%;object-fit:cover}.kquiz__body{padding:12px}.kquiz__text{font-size:15px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;min-height:3.6em}.kquiz__opt[data-checked="1"]{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-weak) inset,0 0 0 1px var(--accent),0 8px 22px rgba(30,75,202,.28);transform:translateY(-1px)}.kquiz__panel{padding:16px;border:1px solid var(--line);border-radius:16px;background:var(--panel);display:flex;flex-direction:column;gap:12px}.kquiz__controls{display:flex;gap:10px;flex-wrap:wrap}.kquiz__btn{appearance:none;border:none;cursor:pointer;background:var(--accent);color:#fff;font-weight:700;padding:12px 16px;border-radius:12px;transition:.2s;box-shadow:0 8px 18px rgba(30,75,202,.22)}.kquiz__btn:hover{transform:translateY(-1px)}.kquiz__btn--sec{background:#203159;color:#e9eeff;border:1px solid #3b4f95}.kquiz__btn--ghost{background:transparent;color:#d1d9ef;border:1px dashed #3b4f95;font-weight:600}.kquiz__tog{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:14px}.kquiz__hint{color:var(--muted);font-size:13px}.kquiz__error{display:none;color:var(--danger);font-weight:700}.kquiz__result{display:none;flex-direction:column;gap:14px}.kquiz__h2{margin:0 0 8px;font-size:26px;color:#eef2ff}.kquiz__row{display:grid;gap:12px;grid-template-columns:280px 1fr max-content;align-items:center;font-size:15px}.kquiz__label{display:flex;align-items:center;gap:10px}.kquiz__bar{height:10px;background:#0f162a;border-radius:999px;border:1px solid #273a74;overflow:hidden}.kquiz__bar>i{display:block;height:100%;background:var(--accent);width:0;transition:width .4s}.kquiz__badge{display:inline-flex;align-items:center;justify-content:center;min-width:44px;padding:4px 12px;border-radius:999px;background:var(--accent);color:#fff;font-weight:900;font-size:12px}.kquiz__winner{border:1px solid var(--accent);box-shadow:0 0 0 3px var(--accent-weak) inset;padding:14px;border-radius:16px;background:#182448}.kquiz__winner h3{margin:0 0 6px}.kquiz__winner p{margin:0;color:#e3e9ff}.kquiz__diploma{margin-top:8px;display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center}.kquiz__btn--big{padding:16px 22px;font-size:16px;border-radius:18px;display:flex;justify-content:center;align-items:center;width:100%;text-decoration:none}.kquiz__dipnote{color:#cbd6f0;font-size:12.5px}.author{max-width:1200px;margin:18px auto 0;text-align:center;color:#9aa7c8;font:12px system-ui}
@media(max-width:1000px){.kquiz__cell{grid-column:span 6}}@media(max-width:700px){.page{padding:10px}.kquiz__row{grid-template-columns:1fr}.kquiz__cell{grid-column:span 12}.kquiz__q{padding:14px}.kquiz__controls{flex-direction:column}.kquiz__btn{width:100%}}
</style>
</head>
<body>
<div class="page"><a class="back" href="../">← Вернуться к резюме</a><div class="kquiz" id="kquiz"><form class="kquiz__form" id="kquiz-form" novalidate><section class="kquiz__head"><h1 class="kquiz__h1">Кем ты можешь стать?</h1><p class="kquiz__lead">Ответь на вопросы, выбери картинку — и узнаешь свой путь. Никакой магии… хотя кто знает 😊</p><div class="kquiz__name"><input type="text" id="kquiz-name" placeholder="Как тебя зовут?"></div></section><div id="kquiz-questions"></div><section class="kquiz__panel"><div class="kquiz__controls"><button type="button" class="kquiz__btn kquiz__btn--ghost" id="kquiz-fill">Заполнить случайно</button><button type="button" class="kquiz__btn kquiz__btn--sec" id="kquiz-reset">Сбросить</button><button type="submit" class="kquiz__btn">Узнать результат</button></div><label class="kquiz__tog"><input type="checkbox" id="kquiz-tie" checked><span>Если баллы равны — выбрать победителя случайно</span></label><div class="kquiz__hint">Все вопросы обязательны.</div><div class="kquiz__error" id="kquiz-err">Пожалуйста, ответь на все вопросы.</div></section><section class="kquiz__result" id="kquiz-result"><h2 class="kquiz__h2">Результаты</h2><div id="kquiz-score"></div><div class="kquiz__winner"><h3 id="kquiz-wtitle"></h3><p id="kquiz-wtext"></p></div><div class="kquiz__diploma" id="kquiz-diploma" hidden><a id="kquiz-dl" class="kquiz__btn kquiz__btn--big" href="#" target="_blank" rel="noopener">Получить диплом</a><div class="kquiz__dipnote">Ссылка уникальна для выбранной профессии.</div></div></section></form></div><div class="author">Разработал Артемий Марущак, 2025</div></div>
<script>
(()=>{const root=document.getElementById('kquiz'),form=document.getElementById('kquiz-form'),host=document.getElementById('kquiz-questions');const C={categories:{doctor:{title:'Врач',blurb:'Любишь заботиться о людях и интересуешься, как устроено тело. Из тебя получится специалист, который помогает и лечит.'},it:{title:'Айтишник',blurb:'Тянет к технике и логике. Подойдут программист, разработчик игр или инженер по роботам.'},police:{title:'Полицейский',blurb:'Смелый, внимательный и справедливый. Помогаешь другим и защищаешь.'}},diplomas:{doctor:'https://disk.yandex.ru/i/gDJ-TySPO1glBA',it:'https://disk.yandex.ru/i/lF4ZzEE6cY6jzA',police:'https://disk.yandex.ru/i/SyxNMEJz8IK-2g'},questions:[
{id:'q1',title:'Что ты выберешь?',options:[['q1_it','Попасть в мир волшебства и приключений, где можешь творить чудеса одним нажатием кнопки.',{it:1},'https://static.tildacdn.com/tild3639-6565-4133-b931-313936383834/IMG_20251026_133158.png'],['q1_doc','Подбирать персональное «топливо» для каждого человека, чтобы он был полон сил и энергии.',{doctor:1},'https://static.tildacdn.com/tild6534-3637-4966-b232-623939623839/IMG_20251026_132549.png'],['q1_police','Раскрывать тайны, находить пропавших людей, ловить преступников.',{police:1},'https://static.tildacdn.com/tild6163-6261-4836-a133-666437643935/IMG_20251026_132414.png'],['q1_idk','Не знаю…',{neutral:1},'https://static.tildacdn.com/tild3638-3232-4431-a266-316135626336/770218b0d7f11156b753.jpg']]},
{id:'q2',title:'Чем ты больше всего любишь заниматься?',options:[['q2_role','Играть в сюжетно-ролевые игры.',{doctor:.5,police:.5},'https://static.tildacdn.com/tild6534-3338-4562-b364-383537303433/IMG_20251026_152437.png'],['q2_gadg','Играть в гаджеты.',{it:1},'https://static.tildacdn.com/tild3464-3165-4539-a335-306538363039/IMG_20251026_152428.png'],['q2_draw','Рисовать.',{neutral:1},'https://static.tildacdn.com/tild3330-6335-4330-a638-653965303939/IMG_20251026_152420.png'],['q2_idk','Не знаю…',{neutral:1},'https://static.tildacdn.com/tild3638-3232-4431-a266-316135626336/770218b0d7f11156b753.jpg']]},
{id:'q3',title:'Чему бы ты хотел(а) научиться?',options:[['q3_body','Знать много о теле человека и как сделать так, чтобы болезни ушли навсегда.',{doctor:1},'https://static.tildacdn.com/tild6639-3136-4639-b264-346163663864/IMG_20251026_155737.png'],['q3_robot','Управлять роботами, думать логически и постоянно развиваться.',{it:1},'https://static.tildacdn.com/tild3964-3233-4464-b461-383066353561/IMG_20251026_155711.png'],['q3_sport','Быстро бегать и ловко двигаться.',{police:1},'https://static.tildacdn.com/tild3863-3436-4638-b135-653733626431/IMG_20251026_160952.png'],['q3_idk','Не знаю…',{neutral:1},'https://static.tildacdn.com/tild3638-3232-4431-a266-316135626336/770218b0d7f11156b753.jpg']]},
{id:'q4',title:'Какие мультфильмы тебе нравятся?',options:[['q4_tech','Где собирают или разбирают любую технику.',{it:1},'https://static.tildacdn.com/tild3935-3862-4033-a233-623963396262/IMG_20251026_164032.png'],['q4_guard','Где защищают людей, догоняют преступников и следят за порядком.',{police:1},'https://static.tildacdn.com/tild6235-6264-4239-a261-663438643362/IMG_20251026_164028.png'],['q4_care','Где заботятся о ком-то.',{doctor:1},'https://static.tildacdn.com/tild3265-6631-4632-b137-643364373562/IMG_20251026_164024.png'],['q4_idk','Не знаю…',{neutral:1},'https://static.tildacdn.com/tild3638-3232-4431-a266-316135626336/770218b0d7f11156b753.jpg']]}]};
C.questions.forEach((q,i)=>{const card=document.createElement('section');card.className='kquiz__q';card.innerHTML=`<h3 class="kquiz__qtitle">Вопрос ${i+1}. ${q.title}</h3><div class="kquiz__grid"></div>`;const grid=card.querySelector('.kquiz__grid');q.options.forEach(([id,text,weights,img])=>{const cell=document.createElement('div');cell.className='kquiz__cell';cell.innerHTML=`<label class="kquiz__opt" data-checked="0"><input type="radio" name="${q.id}" value="${id}" required><img class="kquiz__img" src="${img}" alt=""><div class="kquiz__body"><div class="kquiz__text">${text}</div></div></label>`;cell.querySelector('input').addEventListener('change',()=>{grid.querySelectorAll('.kquiz__opt').forEach(x=>x.dataset.checked='0');cell.querySelector('.kquiz__opt').dataset.checked='1'});grid.appendChild(cell)});host.appendChild(card)});
document.getElementById('kquiz-fill').onclick=()=>{C.questions.forEach(q=>{const pick=q.options[Math.floor(Math.random()*q.options.length)][0],input=root.querySelector(`input[name="${q.id}"][value="${pick}"]`);input.checked=true;input.dispatchEvent(new Event('change',{bubbles:true}))});document.getElementById('kquiz-err').style.display='none';document.getElementById('kquiz-result').style.display='none'};document.getElementById('kquiz-reset').onclick=()=>{form.reset();root.querySelectorAll('.kquiz__opt').forEach(x=>x.dataset.checked='0');document.getElementById('kquiz-err').style.display='none';document.getElementById('kquiz-result').style.display='none'};form.onsubmit=e=>{e.preventDefault();for(const q of C.questions){if(!root.querySelector(`input[name="${q.id}"]:checked`)){document.getElementById('kquiz-err').style.display='block';return}}document.getElementById('kquiz-err').style.display='none';const score={doctor:0,it:0,police:0};C.questions.forEach(q=>{const val=root.querySelector(`input[name="${q.id}"]:checked`).value,opt=q.options.find(o=>o[0]===val),w=opt[2]||{};Object.keys(score).forEach(k=>score[k]+=Number(w[k]||0))});const max=Math.max(...Object.values(score)),tied=Object.keys(score).filter(k=>score[k]===max),winner=tied.length===1?tied[0]:(document.getElementById('kquiz-tie').checked?tied[Math.floor(Math.random()*tied.length)]:tied[0]);render(score,winner)};function render(score,winner){const box=document.getElementById('kquiz-score');box.innerHTML='';const total=Object.values(score).reduce((a,b)=>a+b,0)||1;Object.keys(score).forEach(cat=>{const pct=Math.round(score[cat]/total*100);box.insertAdjacentHTML('beforeend',`<div class="kquiz__row"><div class="kquiz__label"><span class="kquiz__badge">${pct}%</span><span>${C.categories[cat].title}</span></div><div class="kquiz__bar"><i style="width:${pct}%"></i></div><div>${score[cat].toFixed(1)}</div></div>`)});const who=C.categories[winner],name=document.getElementById('kquiz-name').value.trim();document.getElementById('kquiz-wtitle').textContent=(name?name+', ':'')+who.title;document.getElementById('kquiz-wtext').textContent=who.blurb;document.getElementById('kquiz-dl').href=C.diplomas[winner];document.getElementById('kquiz-dl').textContent='Получить диплом: '+who.title;document.getElementById('kquiz-diploma').hidden=false;document.getElementById('kquiz-result').style.display='flex';document.getElementById('kquiz-result').scrollIntoView({behavior:'smooth',block:'start'})}})();
</script>
</body></html>
